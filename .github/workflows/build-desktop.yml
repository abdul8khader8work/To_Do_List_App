name: Build Desktop Apps

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: Windows
          - os: macos-latest
            platform: mac
            artifact: macOS
          - os: ubuntu-latest
            platform: linux
            artifact: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package desktop app
        run: npx electron-builder --${{ matrix.platform }} --config electron-builder.json

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoList-${{ matrix.artifact }}
          path: release/TodoList-${{ matrix.artifact }}.*
          if-no-files-found: error
