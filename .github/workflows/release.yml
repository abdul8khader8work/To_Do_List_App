name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    uses: ./.github/workflows/build-desktop.yml

  build-android:
    uses: ./.github/workflows/build-android.yml

  create-release:
    needs:
      - build-desktop
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TodoList-Windows.exe
            artifacts/TodoList-macOS.dmg
            artifacts/TodoList-Linux.AppImage
            artifacts/TodoList-Android-APK.apk
          generate_release_notes: true
